<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Beshoy | منصة الدكتور بيشوي ثروت</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>

    <div id="auth-overlay" class="overlay">
        <div class="auth-card">
            <div class="auth-header">
                <img src="image_2.png" alt="د. بيشوي" class="auth-thumb">
                <h2 id="auth-title">إنشاء حساب جديد</h2>
                <p>مرحباً بك في رحلة التميز في العلوم</p>
            </div>
            <form id="auth-form">
                <div class="input-group" id="name-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="user-name" placeholder="الاسم الثلاثي">
                </div>
                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="user-phone" placeholder="رقم الموبايل" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="user-pass" placeholder="كلمة المرور" required>
                </div>
                <button type="submit" class="btn-main-grad">دخول المنصة</button>
                <p class="toggle-auth" onclick="toggleAuthMode()">لديك حساب؟ سجل دخولك</p>
            </form>
        </div>
    </div>

    <div id="track-overlay" class="overlay" style="display:none;">
        <div class="track-card">
            <i class="fas fa-language"></i>
            <h3>اختر مسارك الدراسي</h3>
            <div class="track-btns">
                <button class="btn-main-grad" onclick="setTrack('علوم')">اللغة العربية</button>
                <button class="btn-outline" onclick="setTrack('Science')">English Version</button>
            </div>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <header class="main-header">
            <div class="container header-flex">
                <div class="logo">Dr.<span>Beshoy</span></div>
                <div class="user-control">
                    <span id="display-user-name"></span>
                    <button class="logout-btn" onclick="logout()"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </header>

        <section class="hero-section">
            <div class="container hero-grid">
                <div class="hero-text">
                    <h1>منصة الدكتور<br><span>بيشوي ثروت</span></h1>
                    <p>تعلم الكيمياء والعلوم بأحدث التقنيات التفاعلية.</p>
                    <div class="hero-btns">
                        <a href="#stages" class="btn-main-grad">ابدأ الآن</a>
                        <button class="btn-gold" onclick="loadContent('جميع الكورسات')">⭐ الباقة الذهبية</button>
                    </div>
                </div>
                <div class="hero-img-container">
                    <img src="image_2.png" alt="Dr. Beshoy" class="hero-img">
                </div>
            </div>
        </section>

        <section id="stages" class="stages-section">
            <div class="container">
                <h2 class="section-title">المراحل الدراسية</h2>
                <div class="stages-grid">
                    <div class="stage-card" onclick="loadContent('ابتدائي')">
                        <i class="fas fa-microscope"></i>
                        <h3>الابتدائية</h3>
                    </div>
                    <div class="stage-card" onclick="loadContent('اعدادي')">
                        <i class="fas fa-flask"></i>
                        <h3>الإعدادية</h3>
                    </div>
                    <div class="stage-card" onclick="loadContent('ثانوي')">
                        <i class="fas fa-atom"></i>
                        <h3>الثانوية</h3>
                    </div>
                </div>
            </div>
        </section>

        <section id="lessons-area" class="lessons-area" style="display:none;">
            <div class="container">
                <div class="area-header">
                    <h2 id="current-title"></h2>
                    <button class="btn-home" onclick="showHome()"><i class="fas fa-home"></i> الرئيسية</button>
                </div>
                <div id="video-grid" class="video-grid"></div>
            </div>
        </section>
    </div>

    <script src="script.js?v=2.0"></script>
</body>
</html>
