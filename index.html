<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Beshoy | منصة الدكتور بيشوي ثروت</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-overlay" class="overlay">
        <div class="auth-card">
            <div class="profile-main">
                <img src="image_2.png" alt="د. بيشوي ثروت" class="doctor-thumb">
            </div>
            <h2 id="auth-title">إنشاء حساب جديد</h2>
            <form id="auth-form">
                <div class="input-group" id="name-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="user-name" placeholder="الاسم الثلاثي">
                </div>
                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="user-phone" placeholder="رقم الموبايل (الواتساب)" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="user-pass" placeholder="كلمة المرور" required>
                </div>
                <button type="submit" id="auth-submit" class="btn-main">دخول / تسجيل</button>
                <p class="toggle-auth" onclick="toggleAuthMode()">لديك حساب بالفعل؟ سجل دخولك</p>
            </form>
        </div>
    </div>

    <div id="track-overlay" class="overlay" style="display:none;">
        <div class="overlay-content">
            <h3>مرحباً بك.. اختر مسارك الدراسي</h3>
            <div class="lang-btns">
                <button class="btn-main" onclick="setTrack('علوم')">المنهج العربي (علوم)</button>
                <button class="btn-outline" onclick="setTrack('Science')">English (Science)</button>
            </div>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <header class="main-header">
            <div class="container header-flex">
                <div class="logo">Dr.<span>Beshoy</span></div>
                <div class="user-info">
                    <span id="display-user-name"></span>
                    <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </header>

        <section class="hero-section">
            <div class="container hero-grid">
                <div class="hero-text">
                    <h1>منصة الدكتور<br><span>بيشوي ثروت</span></h1>
                    <p>تعلم العلوم والكيمياء بأحدث الوسائل التكنولوجية.</p>
                </div>
                <div class="hero-img-box">
                    <img src="image_2.png" alt="Doctor Science" class="hero-doctor-img">
                </div>
            </div>
        </section>

        <section class="stages-section" id="stages">
            <div class="container">
                <div class="section-nav">
                    <h2>المراحل الدراسية</h2>
                    <button class="all-courses-btn" onclick="loadContent('جميع الكورسات')">⭐ جميع الكورسات</button>
                </div>
                <div class="stages-container">
                    <div class="stage-item" onclick="loadContent('ابتدائي')">
                        <i class="fas fa-microscope"></i>
                        <h3>المرحلة الابتدائية</h3>
                    </div>
                    <div class="stage-item" onclick="loadContent('اعدادي')">
                        <i class="fas fa-flask"></i>
                        <h3>المرحلة الإعدادية</h3>
                    </div>
                    <div class="stage-item" onclick="loadContent('ثانوي')">
                        <i class="fas fa-atom"></i>
                        <h3>المرحلة الثانوية</h3>
                    </div>
                </div>
            </div>
        </section>

        <section id="lessons-area" class="lessons-area" style="display:none;">
            <div class="container">
                <div class="area-header">
                    <h2 id="current-title"></h2>
                    <button class="btn-back" onclick="showHome()">عودة للرئيسية</button>
                </div>
                <div id="video-grid" class="video-grid"></div>
            </div>
        </section>

        <footer class="footer">
            <p>© 2026 جميع الحقوق محفوظة للدكتور بيشوي ثروت</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
